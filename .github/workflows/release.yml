name: Phát hành Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Đóng gói bộ cài
        run: npm run dist

      - name: Đăng GitHub Release và tệp cập nhật
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME 'release/*.exe' 'release/*.blockmap' 'release/latest.yml' --title $env:GITHUB_REF_NAME --generate-notes
